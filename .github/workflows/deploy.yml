name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to Droplet
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.DROPLET_SSH_KEY }}" ]; then
            echo "::error::Secret DROPLET_SSH_KEY is missing in GitHub repository settings!"
            echo "Please add DROPLET_SSH_KEY, DROPLET_SSH_PASSPHRASE, and DROPLET_HOST to Repository Secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies on GitHub
        run: pnpm install

      - name: Run test verification on GitHub
        run: pnpm exec vitest run src/lib/auth-utils.test.ts src/app/api/admin/insights/route.test.ts

      - name: Build Next.js on GitHub (Zero Droplet CPU)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -n "$APP_ENV" ]; then
            echo "$APP_ENV" > .env
          fi
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build
          # Compress the production build for fast transfer (excluding dev cache)
          tar -czf next-build.tar.gz --exclude='.next/cache' .next

      - name: Upload compiled bundle to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST || '143.110.240.33' }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          source: "next-build.tar.gz"
          target: "/var/www/rsp-web"

      - name: Apply build and reload PM2 on Droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.DROPLET_HOST || '143.110.240.33' }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: APP_ENV
          script: |
            set -e
            echo "Navigating to /var/www/rsp-web..."
            cd /var/www/rsp-web

            echo "Syncing latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            if [ -n "$APP_ENV" ]; then
              echo "Updating .env from GitHub Actions APP_ENV secret..."
              echo "$APP_ENV" > .env
              chmod 600 .env
            fi

            echo "Extracting pre-compiled Next.js bundle from GitHub..."
            rm -rf .next
            tar -xzf next-build.tar.gz
            rm -f next-build.tar.gz

            echo "Installing production dependencies..."
            pnpm install --prod

            echo "Reloading Next.js service under PM2..."
            pm2 reload rsp-web || pm2 start pnpm --name "rsp-web" -- start
            pm2 save

            echo "Deployment completed with near-zero droplet CPU!"
