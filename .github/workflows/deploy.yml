name: Automated Deployment to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Unit Tests
        run: pnpm exec vitest run src/lib/auth-utils.test.ts src/app/api/admin/insights/route.test.ts

  deploy:
    name: Deploy to Droplet
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Droplet via SSH Key
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          script: |
            set -e
            echo "Navigating to /var/www/rsp-web..."
            cd /var/www/rsp-web

            echo "Pulling latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            pnpm install

            echo "Building Next.js application..."
            export NODE_OPTIONS="--max-old-space-size=3072"
            pnpm run build

            echo "Restarting application under PM2..."
            pm2 restart rsp-web || pm2 start pnpm --name "rsp-web" -- start
            pm2 save

            echo "Droplet deployment completed successfully!"
