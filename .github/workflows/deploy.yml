name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.DROPLET_SSH_KEY }}" ]; then
            echo "::error::Secret DROPLET_SSH_KEY is missing in GitHub repository settings!"
            echo "Please add DROPLET_SSH_KEY, DROPLET_SSH_PASSPHRASE, and DROPLET_HOST to Repository Secrets."
            exit 1
          fi

      - name: Deploy to Droplet via SSH Key
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.DROPLET_HOST || '143.110.240.33' }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: APP_ENV
          script: |
            set -e
            echo "Navigating to /var/www/rsp-web..."
            cd /var/www/rsp-web

            echo "Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            if [ -n "$APP_ENV" ]; then
              echo "Updating .env from GitHub Actions APP_ENV secret..."
              echo "$APP_ENV" > .env
              chmod 600 .env
            fi

            echo "Installing dependencies..."
            pnpm install

            echo "Running test verification..."
            pnpm exec vitest run src/lib/auth-utils.test.ts src/app/api/admin/insights/route.test.ts

            echo "Building Next.js production bundle..."
            export NODE_OPTIONS="--max-old-space-size=3072"
            pnpm run build

            echo "Restarting Next.js service under PM2..."
            pm2 reload rsp-web || pm2 start pnpm --name "rsp-web" -- start
            pm2 save

            echo "Deployment completed successfully!"
